version: '3.9'

# ─────────────────────────────────────────────────────────────
# ACS Server — Docker Compose
# Optimised for 1 GB RAM deployment
# ─────────────────────────────────────────────────────────────
# Before first run on a new host:
#   sudo ./scripts/setup-swap.sh    # creates 1 GB swap file
#   cp .env.example .env            # fill in secrets
#   docker compose up -d
# ─────────────────────────────────────────────────────────────

services:

  # ── MongoDB ─────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: acs_server_db
    command:
      # Limit WiredTiger cache to 256 MB — critical for 1 GB hosts
      - "mongod"
      - "--wiredTigerCacheSizeGB=0.25"
      - "--quiet"
      - "--logpath=/dev/null"
    volumes:
      - mongo_data:/data/db
    networks:
      - acs_net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: acs_server_db
      CORS_ORIGINS: ""
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - acs_net
    ports:
      - "127.0.0.1:8001:8001"   # expose only on loopback; Caddy proxies externally
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Frontend + Caddy reverse proxy ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = relative URLs (/api/...) — Caddy routes them to backend
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - acs_net
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  acs_net:
    driver: bridge
